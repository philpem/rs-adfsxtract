[package]
name = "cl-filecore-extract"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "acornfsextract"
path = "src/main.rs"

[lib]
name = "acornfsextract"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
crc32fast = "1.5.0"
filetime = "0.2.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
winnow = "1.0.4"

[dev-dependencies]
tempfile = "3.27.0"
flate2 = "1.0"
ureq = { version = "2", features = ["json"] }
ruzstd = "0.7"
zip = "2"
