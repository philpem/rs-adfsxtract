[package]
name = "cl-filecore-extract"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "acornfsextract"
path = "src/main.rs"

[lib]
name = "acornfsextract"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
crc32fast = "1.5.0"
filetime = "0.2.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
winnow = "1.0.4"

# The differential harness (tests/differential.rs) pit our reader against an
# INDEPENDENT second Acorn-disc reader, ejmount/acorn-dfs. It is opt-in via
# `--features differential` so a default `cargo test` never needs to fetch a
# git dependency (and network) just to run the always-on suite.
[features]
differential = ["dep:acorn-dfs"]

[dependencies.acorn-dfs]
git = "https://github.com/ejmount/acorn-dfs"
optional = true

[dev-dependencies]
tempfile = "3.27.0"
flate2 = "1.0"
ureq = { version = "2", features = ["json"] }
ruzstd = "0.7"
zip = "2"
